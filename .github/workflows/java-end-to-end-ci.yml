name: Java Daily Execution CI

on:
  schedule:
    # Every day at 18:30 UTC
    - cron: "30 18 * * *"
  push:
    branches:
      - master
      - cursor/**
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  MOBILE_NUMBER: "9876543210"
  EMAIL_ID: student@example.com

jobs:
  build-and-run-all:
    name: Build & run all programs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile demo module
        working-directory: demo
        run: mvn -B clean compile

      - name: Execute programs and generate HTML report
        if: always()
        working-directory: demo
        run: bash ../.github/scripts/generate-execution-report.sh target/ci-reports src/main/java

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-execution-report-${{ github.run_number }}
          path: demo/target/ci-reports/execution-report.html
          if-no-files-found: error
          retention-days: 90

      - name: Publish report summary
        if: always()
        working-directory: demo
        run: |
          if [ -f target/ci-reports/execution-report.html ]; then
            echo "## Daily Java execution report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Download the **java-execution-report** artifact for the full HTML report (dark theme, per-program output)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            tail -n 3 target/ci-reports/execution-report.html | head -n 1 || true
          fi
