name: Java End-to-End CI

on:
  schedule:
    - cron: "30 18 * * *"
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/java-learning
  MOBILE_NUMBER: 9876543210
  EMAIL_ID: student@example.com

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test with Maven
        working-directory: demo
        run: mvn -B clean verify

      - name: Execute Java programs and create HTML report
        if: always()
        working-directory: demo
        run: |
          report_directory="target/ci-reports"
          report_file="$report_directory/execution-report.html"
          output_file="$report_directory/program-output.txt"
          source_root="src/main/java"
          main_pattern='public[[:space:]]+static[[:space:]]+void[[:space:]]+main[[:space:]]*\('
          mkdir -p "$report_directory"
          SECONDS=0

          cat > "$report_file" <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Java Program Execution Report</title>
            <style>
              body { font-family: sans-serif; margin: 2rem; color: #17212b; }
              h1 { color: #075985; }
              table { border-collapse: collapse; width: 100%; max-width: 900px; }
              th, td { border: 1px solid #cbd5e1; padding: 0.75rem; text-align: left; }
              th { background: #e0f2fe; }
              .pass { color: #166534; font-weight: bold; }
              .fail { color: #b91c1c; font-weight: bold; }
            </style>
          </head>
          <body>
            <h1>Java Program Execution Report</h1>
            <p>Workflow: Java End-to-End CI</p>
            <table>
              <thead><tr><th>Folder</th><th>Program</th><th>Arguments</th><th>Output</th><th>Exit Code</th><th>Status</th></tr></thead>
              <tbody>
          HTML

          program_count=0
          passed_count=0
          failed_count=0
          timed_out_count=0
          programs_run_with_arguments=()

          html_escape() {
            printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'
          }

          run_program() {
            folder="$1"
            program="$2"
            arguments="$3"

            # A program that needs arguments must not be invoked again by the
            # later no-argument discovery scan.
            if [ -n "$arguments" ]; then
              programs_run_with_arguments+=("$program")
            fi

            set +e
            timeout --kill-after=2s 5s java -cp target/classes "$program" $arguments > "$output_file" 2>&1
            exit_code=$?
            set -e
            output=$(head -c 20000 "$output_file")

            if [ "$exit_code" -eq 0 ]; then
              status="PASSED"
              css_class="pass"
              passed_count=$((passed_count + 1))
            elif [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 137 ]; then
              status="TIMED OUT"
              css_class="fail"
              timed_out_count=$((timed_out_count + 1))
            else
              status="FAILED"
              css_class="fail"
              failed_count=$((failed_count + 1))
            fi

            printf '<tr><td>%s</td><td>%s</td><td>%s</td><td><pre>%s</pre></td><td>%s</td><td class="%s">%s</td></tr>\n' \
              "$(html_escape "$folder")" "$(html_escape "$program")" "$(html_escape "$arguments")" \
              "$(html_escape "$output")" "$exit_code" "$css_class" "$status" >> "$report_file"
            echo "[$status] $folder > $program (exit code: $exit_code)"
            printf '%s\n' "$output"
            program_count=$((program_count + 1))
          }

          run_program "regularExpressions" "com.regularExpressions.checkNumber" "mobile $MOBILE_NUMBER"
          run_program "regularExpressions" "com.regularExpressions.checkNumber" "email $EMAIL_ID"

          # Only execute source files that declare a Java application entry point.
          # Base, helper, model, and collection-support classes without main() are
          # compiled by Maven but intentionally never passed to the java command.
          has_main_method() {
            grep -q -E "$main_pattern" "$1"
          }

          was_run_with_arguments() {
            for configured_program in "${programs_run_with_arguments[@]}"; do
              [ "$configured_program" = "$1" ] && return 0
            done
            return 1
          }

          while IFS= read -r -d '' source_file; do
            has_main_method "$source_file" || continue
            class_name=${source_file#"$source_root"/}
            class_name=${class_name%.java}
            class_name=${class_name//\//.}
            was_run_with_arguments "$class_name" && continue
            relative_path=${source_file#"$source_root"/com/}
            folder=${relative_path%%/*}
            run_program "$folder" "$class_name" ""
          done < <(find "$source_root" -name '*.java' -print0 | sort -z)

          total_duration_seconds=$SECONDS
          printf '    <p><strong>Execution summary:</strong> %s programs scanned in %s seconds. Passed: %s. Failed: %s. Timed out: %s.</p>\n' \
            "$program_count" "$total_duration_seconds" "$passed_count" "$failed_count" "$timed_out_count" >> "$report_file"

          cat >> "$report_file" <<'HTML'
              </tbody>
            </table>
          </body>
          </html>
          HTML

          echo "Executed $program_count programs in $total_duration_seconds seconds: $passed_count passed, $failed_count failed, $timed_out_count timed out."
          echo "HTML execution report created: $report_file"

      - name: Upload Java execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-execution-report
          path: demo/target/ci-reports/execution-report.html
          if-no-files-found: warn

      - name: Upload Surefire XML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: demo/target/surefire-reports/*.xml
          if-no-files-found: ignore

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag_sha: ${{ steps.image_tags.outputs.image_tag_sha }}
      image_tag_latest: ${{ steps.image_tags.outputs.image_tag_latest }}
      pushed: ${{ steps.push_flag.outputs.pushed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag outputs
        id: image_tags
        run: |
          echo "image_tag_sha=ghcr.io/${{ github.repository_owner }}/java-learning:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image_tag_latest=ghcr.io/${{ github.repository_owner }}/java-learning:latest" >> "$GITHUB_OUTPUT"

      - name: Set push flag
        id: push_flag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: demo
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          provenance: false
          sbom: false

  notify:
    name: Notify via Email
    runs-on: ubuntu-latest
    needs: [build-test, docker]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Java execution report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: java-execution-report
          path: ci-report

      - name: Count Java programs
        id: program_counts
        shell: bash
        run: |
          source_root="demo/src/main/java/com"
          main_pattern='public[[:space:]]+static[[:space:]]+void[[:space:]]+main[[:space:]]*\('

          # grep exits 1 when there are no matches. Actions runs bash with
          # -o pipefail, so that would fail the step for empty folders.
          count_mains() {
            grep -R -E -h --include='*.java' "$main_pattern" "$1" 2>/dev/null | wc -l | tr -d ' ' || true
          }

          total_programs=$(count_mains "$source_root")
          folder_counts=""

          for folder in "$source_root"/*; do
            [ -d "$folder" ] || continue
            folder_name=$(basename "$folder")
            program_count=$(count_mains "$folder")
            folder_counts="${folder_counts}${folder_name}: ${program_count}; "
          done

          echo "total_programs=$total_programs" >> "$GITHUB_OUTPUT"
          echo "folder_counts=$folder_counts" >> "$GITHUB_OUTPUT"

      - name: Check email configuration
        id: email_check
        shell: bash
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          strip_quotes() {
            local value
            value=$(trim "$1")
            value="${value#\"}"
            value="${value%\"}"
            value="${value#\'}"
            value="${value%\'}"
            printf '%s' "$value"
          }

          if [ -n "${RESEND_API_KEY}" ] && [ -n "${SMTP_TO}" ]; then
            echo "provider=resend" >> "${GITHUB_OUTPUT}"
            echo "ready=true" >> "${GITHUB_OUTPUT}"
            echo "Email provider: Resend API (recommended for GitHub Actions)."
            exit 0
          fi

          echo "provider=smtp" >> "${GITHUB_OUTPUT}"
          echo "is_gmail=false" >> "${GITHUB_OUTPUT}"

          if [ -z "${SMTP_SERVER}" ] || [ -z "${SMTP_PORT}" ] || \
             [ -z "${SMTP_USERNAME}" ] || [ -z "${SMTP_PASSWORD}" ] || \
             [ -z "${SMTP_FROM}" ] || [ -z "${SMTP_TO}" ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "Email not configured. Add RESEND_API_KEY (recommended) or all SMTP_* secrets."
            exit 0
          fi

          server=$(strip_quotes "${SMTP_SERVER}")
          port=$(strip_quotes "${SMTP_PORT}")
          user=$(strip_quotes "${SMTP_USERNAME}")
          pass=$(strip_quotes "${SMTP_PASSWORD}")
          from=$(strip_quotes "${SMTP_FROM}")

          user_lower=$(printf '%s' "$user" | tr '[:upper:]' '[:lower:]')
          user_domain="${user_lower##*@}"
          pass=$(printf '%s' "$pass" | tr -cd '[:alnum:]')
          pass_len=${#pass}

          echo "username_domain=${user_domain}" >> "${GITHUB_OUTPUT}"
          echo "password_length=${pass_len}" >> "${GITHUB_OUTPUT}"

          if [[ "${server}" == *"gmail.com"* ]]; then
            echo "is_gmail=true" >> "${GITHUB_OUTPUT}"
            if [[ "${user_lower}" != *"@gmail.com" && "${user_lower}" != *"@googlemail.com" ]]; then
              echo "::error::Gmail SMTP requires @gmail.com in SMTP_USERNAME (got @${user_domain})."
              echo "::error::Gmail SMTP often fails from GitHub Actions with 535 even with valid App Passwords."
              echo "::error::Use RESEND_API_KEY instead (see docs/java-e2e-ci-quick-runbook.md)."
              echo "ready=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            if [[ "${pass_len}" -ne 16 ]]; then
              echo "::error::Gmail App Password must be 16 characters (got ${pass_len})."
              echo "ready=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          echo "::add-mask::${pass}"
          echo "Email provider: Gmail SMTP (may fail from cloud CI runners)."
          echo "SMTP diagnostics: server=${server}, port=${port}, username_domain=@${user_domain}, password_length=${pass_len}"
          if [[ "${pass_len}" -ge 4 ]]; then
            echo "password_fingerprint=${pass:0:2}********${pass: -2}" >> "${GITHUB_OUTPUT}"
          fi
          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Send email notification
        id: send_mail
        if: steps.email_check.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        env:
          EMAIL_PROVIDER: ${{ steps.email_check.outputs.provider }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          EMAIL_SUBJECT: "Java E2E CI Pipeline — ${{ github.ref_name }} (${{ github.sha }})"
        run: |
          mkdir -p ci-report
          cat > ci-report/email-body.txt <<EOF
          Java End-to-End CI Pipeline Run Summary
          ========================================

          Repository : ${{ github.repository }}
          Branch     : ${{ github.ref_name }}
          Commit SHA : ${{ github.sha }}
          Triggered by: ${{ github.event_name }}

          Job Results
          -----------
          build-test : ${{ needs.build-test.result }}
          docker     : ${{ needs.docker.result }}

          Java Program Counts
          -------------------
          Total main methods in repository : ${{ steps.program_counts.outputs.total_programs }}
          By top-level source folder        : ${{ steps.program_counts.outputs.folder_counts }}

          Docker Image Details
          --------------------
          Image name : ghcr.io/${{ github.repository_owner }}/java-learning
          SHA tag    : ghcr.io/${{ github.repository_owner }}/java-learning:${{ github.sha }}
          Latest tag : ghcr.io/${{ github.repository_owner }}/java-learning:latest
          Pushed     : ${{ needs.docker.outputs.pushed }}

          Note: Images are pushed to GHCR only on push events (not on pull requests).

          View workflow run:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          python3 <<'PY'
          import base64
          import json
          import os
          import re
          import smtplib
          import socket
          import ssl
          import sys
          import urllib.error
          import urllib.request
          from email.mime.application import MIMEApplication
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from pathlib import Path

          def clean(value: str) -> str:
              value = value.strip().strip('"').strip("'")
              return re.sub(r"\s+", "", value)

          def clean_password(value: str) -> str:
              return re.sub(r"[^a-zA-Z0-9]", "", clean(value))

          subject = os.environ["EMAIL_SUBJECT"]
          body = Path("ci-report/email-body.txt").read_text(encoding="utf-8")
          attachment = Path("ci-report/execution-report.html")
          to_addr = clean(os.environ["SMTP_TO"])
          provider = os.environ.get("EMAIL_PROVIDER", "smtp")

          def send_via_resend() -> None:
              api_key = clean(os.environ["RESEND_API_KEY"])
              from_addr = os.environ.get("RESEND_FROM", "").strip()
              if not from_addr:
                  from_addr = "Java E2E CI <onboarding@resend.dev>"
              payload = {
                  "from": from_addr,
                  "to": [to_addr],
                  "subject": subject,
                  "text": body,
              }
              if attachment.is_file():
                  payload["attachments"] = [{
                      "filename": attachment.name,
                      "content": base64.b64encode(attachment.read_bytes()).decode(),
                  }]
              request = urllib.request.Request(
                  "https://api.resend.com/emails",
                  data=json.dumps(payload).encode(),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      print(f"Resend API response: {response.read().decode()}")
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode()
                  print(f"::error::Resend API failed ({exc.code}): {detail}")
                  raise SystemExit(detail) from exc

          def send_via_smtp() -> None:
              host = clean(os.environ["SMTP_SERVER"])
              port = int(clean(os.environ["SMTP_PORT"]))
              user = clean(os.environ["SMTP_USERNAME"]).lower()
              password = clean_password(os.environ["SMTP_PASSWORD"])
              from_addr = clean(os.environ["SMTP_FROM"])
              if from_addr.lower() != user:
                  print(f"Using SMTP_USERNAME as From address ({user})")
                  from_addr = user

              if "gmail.com" in host and len(password) != 16:
                  print(f"::error::Gmail App Password must be 16 characters after cleanup (got {len(password)}).")
                  sys.exit(1)

              local, _, domain = user.partition("@")
              masked_user = f"{local[0]}***{local[-1]}@{domain}" if len(local) > 1 else user
              print(f"Authenticating as {masked_user} with app-password fingerprint {password[:2]}********{password[-2:]}")

              ipv4 = socket.getaddrinfo(host, port, socket.AF_INET, socket.SOCK_STREAM)[0][4][0]
              print(f"Connecting to {host} via IPv4 {ipv4}:{port}")

              msg = MIMEMultipart()
              msg["From"] = from_addr
              msg["To"] = to_addr
              msg["Subject"] = subject
              msg.attach(MIMEText(body, "plain", "utf-8"))

              if attachment.is_file():
                  part = MIMEApplication(attachment.read_bytes(), Name=attachment.name)
                  part["Content-Disposition"] = f'attachment; filename="{attachment.name}"'
                  msg.attach(part)

              context = ssl.create_default_context()
              try:
                  if port == 465:
                      with socket.create_connection((ipv4, port), timeout=60) as raw:
                          with context.wrap_socket(raw, server_hostname=host) as tls_sock:
                              with smtplib.SMTP(timeout=60) as smtp:
                                  smtp._host = host
                                  smtp.sock = tls_sock
                                  smtp.file = tls_sock.makefile("rb")
                                  smtp.ehlo()
                                  smtp.login(user, password)
                                  smtp.send_message(msg)
                  else:
                      with smtplib.SMTP(timeout=60) as smtp:
                          smtp._host = host
                          smtp.connect(ipv4, port)
                          smtp.ehlo()
                          smtp.starttls(context=context)
                          smtp.ehlo()
                          smtp.login(user, password)
                          smtp.send_message(msg)
              except smtplib.SMTPAuthenticationError as exc:
                  print("::error::Gmail rejected SMTP login (535 BadCredentials).")
                  print("Gmail SMTP often fails from GitHub Actions even with a valid App Password.")
                  print("Recommended fix: add RESEND_API_KEY secret and use Resend instead of Gmail SMTP.")
                  print("See docs/java-e2e-ci-quick-runbook.md")
                  raise SystemExit(str(exc)) from exc

          if provider == "resend":
              print("Sending email via Resend API.")
              send_via_resend()
          else:
              print("Sending email via SMTP.")
              send_via_smtp()

          print("Email sent successfully.")
          PY

      - name: Report email delivery failure
        if: steps.email_check.outputs.ready == 'true' && steps.send_mail.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Email notification failed."
          if [ "${{ steps.email_check.outputs.provider }}" = "resend" ]; then
            echo "Resend failed. Verify RESEND_API_KEY and RESEND_FROM in Settings → Secrets → Actions."
            echo "Create a free API key at https://resend.com/api-keys"
          else
            echo "Diagnostics: username_domain=@${{ steps.email_check.outputs.username_domain }}, password_length=${{ steps.email_check.outputs.password_length }}, fingerprint=${{ steps.email_check.outputs.password_fingerprint }}"
            echo "Gmail SMTP frequently returns 535 from GitHub Actions datacenter IPs."
            echo "Recommended: add RESEND_API_KEY (see docs/java-e2e-ci-quick-runbook.md) instead of Gmail SMTP."
          fi
